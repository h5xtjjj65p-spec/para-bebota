name: Descomprimir y publicar

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  descomprimir:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir ZIP
        run: |
          unzip -o "para-ella-profesional-con-musica.zip" -d ./sitio
          find ./sitio -type f

      - name: Mover archivos a la raíz
        run: |
          cp -r ./sitio/* .
          rm -rf ./sitio
          rm -f "para-ella-profesional-con-musica.zip"

      - name: Guardar archivos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Descomprimir página"
          git push