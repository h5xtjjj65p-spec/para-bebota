name: Descomprimir proyecto

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          mkdir temp
          unzip -q para-ella.zip -d temp

          shopt -s dotglob nullglob
          items=(temp/*)

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -a "${items[0]}"/. .
          else
            cp -a temp/. .
          fi

          rm -rf temp
          rm -f para-ella.zip

      - name: Guardar archivos
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Descomprimir proyecto" || echo "No hay cambios"
          git push